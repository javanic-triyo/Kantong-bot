name: Kantong Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # setiap 15 menit (jadwal GitHub kadang telat beberapa menit)
  workflow_dispatch:
    inputs:
      test:
        description: "Kirim notifikasi tes?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kantong-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIF: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
        run: python bot.py

      - name: Simpan state
        run: |
          git config user.name "kantong-bot"
          git config user.email "kantong-bot@users.noreply.github.com"
          git add state.json docs/data.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "update state $(TZ=Asia/Jakarta date '+%d/%m %H:%M')"
            git pull --rebase origin main || true
            git push
          fi
