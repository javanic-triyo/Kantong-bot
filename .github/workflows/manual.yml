name: Trade Manual

on:
  workflow_dispatch:
    inputs:
      koin:
        description: "Koin"
        type: choice
        options: [UAI, XRP, HYPE, PEPE, SOL]
      aksi:
        description: "Beli atau jual?"
        type: choice
        options: [beli, jual]
      jumlah:
        description: "Jumlah Rupiah (contoh 100000). Kosongkan atau tulis 'semua' = pakai semua dana / jual semua"
        type: string
        default: "100000"

permissions:
  contents: write

concurrency:
  group: kantong-manual
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Eksekusi trade manual (paper)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KOIN: ${{ github.event.inputs.koin }}
          AKSI: ${{ github.event.inputs.aksi }}
          JUMLAH: ${{ github.event.inputs.jumlah }}
        run: |
          git config user.name "kantong-bot"
          git config user.email "kantong-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git pull -q --rebase origin main || true
            python manual.py
            git add state.json docs/data.json
            git diff --cached --quiet && exit 0
            git commit -q -m "trade manual: $AKSI $KOIN"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push ditolak, ulang dengan state terbaru..."
            git reset -q --hard HEAD~1
          done
          exit 1
