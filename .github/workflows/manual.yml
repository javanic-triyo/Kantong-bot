name: Trade Manual

on:
  workflow_dispatch:
    inputs:
      koin:
        description: "Koin"
        type: choice
        options: [UAI, XRP, HYPE, PEPE, SOL]
      aksi:
        description: "Beli atau jual?"
        type: choice
        options: [beli, jual]
      jumlah:
        description: "Jumlah Rupiah (contoh 100000). Kosongkan atau tulis 'semua' = pakai semua dana / jual semua"
        type: string
        default: "100000"

permissions:
  contents: write

concurrency:
  group: kantong-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Eksekusi trade manual (paper)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KOIN: ${{ github.event.inputs.koin }}
          AKSI: ${{ github.event.inputs.aksi }}
          JUMLAH: ${{ github.event.inputs.jumlah }}
        run: python manual.py
      - name: Simpan state
        run: |
          git config user.name "kantong-bot"
          git config user.email "kantong-bot@users.noreply.github.com"
          git add state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "trade manual: ${{ github.event.inputs.aksi }} ${{ github.event.inputs.koin }}"
            git pull --rebase origin main || true
            git push
          fi
